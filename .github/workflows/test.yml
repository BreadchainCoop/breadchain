name: test

on:
  workflow_dispatch:
  pull_request:
    branches: [ dev, main ]
  push:
    branches: [ dev, main ]

env:
  FOUNDRY_PROFILE: ci
  FOUNDRY_DISABLE_NIGHTLY_WARNING: true

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Forge build
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test

  upgrade-safety:
    name: Upgrade Safety Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run upgrade safety validation
        run: |
          forge clean && forge build
          
          # Check if previous flattened contracts exist
          if [ -f "test/upgrades/flattened/previous/YieldDistributor.sol" ] && [ -f "test/upgrades/flattened/previous/ButteredBread.sol" ]; then
            echo "Previous version found, running upgrade validation..."
            forge script script/upgrades/ValidateUpgrade.s.sol
          else
            echo "No previous version found, skipping upgrade validation (initial deployment)"
            echo "Contracts will be validated and flattened on first merge to dev"
          fi

  flatten:
    name: Flatten and Track Contracts
    runs-on: ubuntu-latest
    needs: [check, upgrade-safety]  # Only run after tests and validation pass
    
    # Only run on push to dev branch, not on PRs or main
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Create flattened contracts directory
        run: mkdir -p test/upgrades/flattened/current

      - name: Flatten YieldDistributor and ButteredBread
        run: |
          # Flatten the main contracts to current directory
          forge flatten src/YieldDistributor.sol > "test/upgrades/flattened/current/YieldDistributor.sol"
          forge flatten src/ButteredBread.sol > "test/upgrades/flattened/current/ButteredBread.sol"
          
          # Copy current to previous for future upgrade validations
          rm -rf test/upgrades/flattened/previous
          cp -r test/upgrades/flattened/current test/upgrades/flattened/previous
          
          echo "Flattened contracts saved to test/upgrades/flattened/current/"
          echo "Previous version backed up to test/upgrades/flattened/previous/"

      - name: Install solc for compilation check
        run: |
          sudo add-apt-repository -y ppa:ethereum/ethereum
          sudo apt-get update
          sudo apt-get install -y solc

      - name: Verify flattened contracts compile
        run: |
          for f in test/upgrades/flattened/current/*.sol; do
            echo "Checking compilation of $(basename $f)..."
            if ! solc --optimize "$f" --via-ir --bin > /dev/null 2>&1; then
              echo "❌ Compilation failed for $(basename $f). Error output:"
              solc --optimize "$f" --via-ir --bin
              exit 1
            else
              echo "✅ Successfully compiled $(basename $f)"
            fi
          done

      - name: Commit flattened contracts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: test/upgrades/flattened/**/*.sol
          commit_message: "chore: auto-flatten contracts after validation passes [skip ci]"
          push_options: '--follow-tags'