name: test

on:
  workflow_dispatch:
  pull_request:
    branches: [ dev, main ]
  push:
    branches: [ dev, main ]

env:
  FOUNDRY_PROFILE: ci
  FOUNDRY_DISABLE_NIGHTLY_WARNING: true

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Forge build
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test

  upgrade-safety:
    name: Upgrade Safety Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run upgrade safety validation
        run: |
          forge clean && forge build
          forge script script/upgrades/ValidateUpgrade.s.sol

  flatten:
    name: Flatten and Track Contracts
    runs-on: ubuntu-latest
    needs: [check, upgrade-safety]  # Only run after tests and validation pass
    
    # Only run on push to main branches, not on PRs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Create flattened contracts directory
        run: mkdir -p test/upgrades/flattened

      - name: Flatten YieldDistributor and ButteredBread
        run: |
          # Get the current version tag or use commit hash
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)
          
          # Create version-specific directory
          mkdir -p "test/upgrades/flattened/${VERSION}"
          
          # Flatten the main contracts
          forge flatten src/YieldDistributor.sol > "test/upgrades/flattened/${VERSION}/YieldDistributor.sol"
          forge flatten src/ButteredBread.sol > "test/upgrades/flattened/${VERSION}/ButteredBread.sol"
          
          echo "Flattened contracts saved to test/upgrades/flattened/${VERSION}/"

      - name: Install solc for compilation check
        run: |
          sudo add-apt-repository -y ppa:ethereum/ethereum
          sudo apt-get update
          sudo apt-get install -y solc

      - name: Verify flattened contracts compile
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)
          for f in test/upgrades/flattened/${VERSION}/*.sol; do
            echo "Checking compilation of $(basename $f)..."
            solc --optimize "$f" --via-ir --bin > /dev/null
          done

      - name: Commit flattened contracts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: test/upgrades/flattened/**/*.sol
          commit_message: "chore: auto-flatten contracts after validation passes [skip ci]"
          push_options: '--follow-tags'