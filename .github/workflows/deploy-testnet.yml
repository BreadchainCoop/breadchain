name: Deploy All Contracts to Testnet

on:
  push:
    branches:
      - dev
      - staging
  pull_request:
    branches:
      - dev
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build contracts
        run: forge build

      - name: Run tests (with fork)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TESTNET_RPC_URL: ${{ secrets.TESTNET_RPC_URL }}
        run: |
          if [ -n "$TESTNET_RPC_URL" ]; then
            forge test --fork-url "$TESTNET_RPC_URL" -vvvv
          else
            forge test -vvvv
          fi
      
      - name: Run tests (without fork for external PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: forge test -vvvv

      - name: Initialize deployment tracking
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TESTNET_RPC_URL: ${{ secrets.TESTNET_RPC_URL }}
          TESTNET_PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
        run: |
          if [ -n "$TESTNET_RPC_URL" ] && [ -n "$TESTNET_PRIVATE_KEY" ]; then
            echo '{"timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'", "network": "testnet", "contracts": {}}' > deployment.json
          fi

      - name: Deploy ButteredBread
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TESTNET_RPC_URL: ${{ secrets.TESTNET_RPC_URL }}
          TESTNET_PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
          PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
        run: |
          if [ -n "$TESTNET_RPC_URL" ] && [ -n "$TESTNET_PRIVATE_KEY" ]; then
            echo "Deploying ButteredBread..."
            
            # Run the deployment script and capture exit code
            set +e
            forge script script/deploy/DeployButteredBread.s.sol:DeployButteredBread \
              --rpc-url "$TESTNET_RPC_URL" \
              --broadcast \
              --private-key "$TESTNET_PRIVATE_KEY" \
              --json > butteredbread_deploy.json 2>&1
            EXIT_CODE=$?
            set -e
            
            # Always show output for debugging
            echo "Forge script exit code: $EXIT_CODE"
            
            # Check if the output is valid JSON by trying to parse it
            if [ $EXIT_CODE -eq 0 ] && jq -e . butteredbread_deploy.json >/dev/null 2>&1; then
              ADDRESS=$(jq -r '.transactions[0].contractAddress // empty' butteredbread_deploy.json 2>/dev/null || echo "")
              if [ -n "$ADDRESS" ] && [ "$ADDRESS" != "null" ] && [ "$ADDRESS" != "" ]; then
                if [ -f deployment.json ]; then
                  jq --arg addr "$ADDRESS" '.contracts.ButteredBread = $addr' deployment.json > temp.json && mv temp.json deployment.json
                fi
                echo "✅ ButteredBread deployed to: $ADDRESS"
              else
                echo "⚠️ ButteredBread deployment completed but no contract address found"
                echo "Output:"
                cat butteredbread_deploy.json
              fi
            else
              echo "❌ ButteredBread deployment failed. Output:"
              cat butteredbread_deploy.json
            fi
          fi

      - name: Deploy YieldDistributor
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TESTNET_RPC_URL: ${{ secrets.TESTNET_RPC_URL }}
          TESTNET_PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
          PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
        run: |
          if [ -n "$TESTNET_RPC_URL" ] && [ -n "$TESTNET_PRIVATE_KEY" ]; then
            echo "Deploying YieldDistributor..."
            
            # Run the deployment script and capture exit code
            set +e
            forge script script/deploy/DeployYieldDistributor.s.sol:DeployYieldDistributor \
              --rpc-url "$TESTNET_RPC_URL" \
              --broadcast \
              --private-key "$TESTNET_PRIVATE_KEY" \
              --json > yielddistributor_deploy.json 2>&1
            EXIT_CODE=$?
            set -e
            
            # Always show output for debugging
            echo "Forge script exit code: $EXIT_CODE"
            
            # Check if the output is valid JSON by trying to parse it
            if [ $EXIT_CODE -eq 0 ] && jq -e . yielddistributor_deploy.json >/dev/null 2>&1; then
              ADDRESS=$(jq -r '.transactions[0].contractAddress // empty' yielddistributor_deploy.json 2>/dev/null || echo "")
              if [ -n "$ADDRESS" ] && [ "$ADDRESS" != "null" ] && [ "$ADDRESS" != "" ]; then
                if [ -f deployment.json ]; then
                  jq --arg addr "$ADDRESS" '.contracts.YieldDistributor = $addr' deployment.json > temp.json && mv temp.json deployment.json
                fi
                echo "✅ YieldDistributor deployed to: $ADDRESS"
              else
                echo "⚠️ YieldDistributor deployment completed but no contract address found"
                echo "Output:"
                cat yielddistributor_deploy.json
              fi
            else
              echo "❌ YieldDistributor deployment failed. Output:"
              cat yielddistributor_deploy.json
            fi
          fi

      - name: Deploy NFTMultiplier
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TESTNET_RPC_URL: ${{ secrets.TESTNET_RPC_URL }}
          TESTNET_PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
          PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
          NFT_CONTRACT_ADDRESS: ${{ secrets.NFT_CONTRACT_ADDRESS || '0x0000000000000000000000000000000000000000' }}
          INITIAL_MULTIPLYING_FACTOR: ${{ secrets.INITIAL_MULTIPLYING_FACTOR || '1100' }}
          VALID_UNTIL_BLOCK: ${{ secrets.VALID_UNTIL_BLOCK || '999999999' }}
        run: |
          if [ -n "$TESTNET_RPC_URL" ] && [ -n "$TESTNET_PRIVATE_KEY" ]; then
            # Check if NFT_CONTRACT_ADDRESS is set and not the zero address
            if [ "$NFT_CONTRACT_ADDRESS" = "0x0000000000000000000000000000000000000000" ]; then
              echo "⚠️ Skipping NFTMultiplier deployment: NFT_CONTRACT_ADDRESS not configured"
              echo "To deploy NFTMultiplier, set the NFT_CONTRACT_ADDRESS secret in repository settings"
            else
              echo "Deploying NFTMultiplier..."
              echo "NFT Contract: $NFT_CONTRACT_ADDRESS"
              echo "Multiplying Factor: $INITIAL_MULTIPLYING_FACTOR"
              echo "Valid Until Block: $VALID_UNTIL_BLOCK"
              
              # Run the deployment script and capture exit code
              set +e
              forge script script/deploy/DeployNFTMultiplier.s.sol:DeployNFTMultiplier \
                --rpc-url "$TESTNET_RPC_URL" \
                --broadcast \
                --private-key "$TESTNET_PRIVATE_KEY" \
                --json > nftmultiplier_deploy.json 2>&1
              EXIT_CODE=$?
              set -e
              
              # Always show output for debugging
              echo "Forge script exit code: $EXIT_CODE"
              
              # Check if the output is valid JSON by trying to parse it
              if [ $EXIT_CODE -eq 0 ] && jq -e . nftmultiplier_deploy.json >/dev/null 2>&1; then
                ADDRESS=$(jq -r '.transactions[0].contractAddress // empty' nftmultiplier_deploy.json 2>/dev/null || echo "")
                if [ -n "$ADDRESS" ] && [ "$ADDRESS" != "null" ] && [ "$ADDRESS" != "" ]; then
                  if [ -f deployment.json ]; then
                    jq --arg addr "$ADDRESS" '.contracts.NFTMultiplier = $addr' deployment.json > temp.json && mv temp.json deployment.json
                  fi
                  echo "✅ NFTMultiplier deployed to: $ADDRESS"
                else
                  echo "⚠️ NFTMultiplier deployment completed but no contract address found"
                  echo "Output:"
                  cat nftmultiplier_deploy.json
                fi
              else
                echo "❌ NFTMultiplier deployment failed. Output:"
                cat nftmultiplier_deploy.json
              fi
            fi
          fi

      - name: Deploy VotingStreakMultiplier
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TESTNET_RPC_URL: ${{ secrets.TESTNET_RPC_URL }}
          TESTNET_PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
          PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
        run: |
          if [ -n "$TESTNET_RPC_URL" ] && [ -n "$TESTNET_PRIVATE_KEY" ]; then
            echo "Deploying VotingStreakMultiplier..."
            
            # Run the deployment script and capture exit code
            set +e
            forge script script/deploy/DeployVotingStreakMultiplier.s.sol:DeployVotingStreakMultiplier \
              --rpc-url "$TESTNET_RPC_URL" \
              --broadcast \
              --private-key "$TESTNET_PRIVATE_KEY" \
              --json > votingstreakMultiplier_deploy.json 2>&1
            EXIT_CODE=$?
            set -e
            
            # Always show output for debugging
            echo "Forge script exit code: $EXIT_CODE"
            
            # Check if the output is valid JSON by trying to parse it
            if [ $EXIT_CODE -eq 0 ] && jq -e . votingstreakMultiplier_deploy.json >/dev/null 2>&1; then
              ADDRESS=$(jq -r '.transactions[0].contractAddress // empty' votingstreakMultiplier_deploy.json 2>/dev/null || echo "")
              if [ -n "$ADDRESS" ] && [ "$ADDRESS" != "null" ] && [ "$ADDRESS" != "" ]; then
                if [ -f deployment.json ]; then
                  jq --arg addr "$ADDRESS" '.contracts.VotingStreakMultiplier = $addr' deployment.json > temp.json && mv temp.json deployment.json
                fi
                echo "✅ VotingStreakMultiplier deployed to: $ADDRESS"
              else
                echo "⚠️ VotingStreakMultiplier deployment completed but no contract address found"
                echo "Output:"
                cat votingstreakMultiplier_deploy.json
              fi
            else
              echo "❌ VotingStreakMultiplier deployment failed. Output:"
              cat votingstreakMultiplier_deploy.json
            fi
          fi

      - name: Verify contracts on block explorer
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          TESTNET_RPC_URL: ${{ secrets.TESTNET_RPC_URL }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          if [ -n "$TESTNET_RPC_URL" ] && [ -n "$ETHERSCAN_API_KEY" ] && [ -f deployment.json ]; then
            echo "Starting contract verification..."
            VERIFICATION_FAILED=false
            
            # Verify ButteredBread
            BUTTEREDBREAD_ADDR=$(jq -r '.contracts.ButteredBread // empty' deployment.json)
            if [ -n "$BUTTEREDBREAD_ADDR" ] && [ "$BUTTEREDBREAD_ADDR" != "null" ]; then
              echo "Verifying ButteredBread at $BUTTEREDBREAD_ADDR..."
              forge verify-contract "$BUTTEREDBREAD_ADDR" src/ButteredBread.sol:ButteredBread --rpc-url "$TESTNET_RPC_URL" --etherscan-api-key "$ETHERSCAN_API_KEY" || VERIFICATION_FAILED=true
            fi
            
            # Verify YieldDistributor
            YIELDDISTRIBUTOR_ADDR=$(jq -r '.contracts.YieldDistributor // empty' deployment.json)
            if [ -n "$YIELDDISTRIBUTOR_ADDR" ] && [ "$YIELDDISTRIBUTOR_ADDR" != "null" ]; then
              echo "Verifying YieldDistributor at $YIELDDISTRIBUTOR_ADDR..."
              forge verify-contract "$YIELDDISTRIBUTOR_ADDR" src/YieldDistributor.sol:YieldDistributor --rpc-url "$TESTNET_RPC_URL" --etherscan-api-key "$ETHERSCAN_API_KEY" || VERIFICATION_FAILED=true
            fi
            
            # Verify NFTMultiplier
            NFTMULTIPLIER_ADDR=$(jq -r '.contracts.NFTMultiplier // empty' deployment.json)
            if [ -n "$NFTMULTIPLIER_ADDR" ] && [ "$NFTMULTIPLIER_ADDR" != "null" ]; then
              echo "Verifying NFTMultiplier at $NFTMULTIPLIER_ADDR..."
              forge verify-contract "$NFTMULTIPLIER_ADDR" src/NFTMultiplier.sol:NFTMultiplier --rpc-url "$TESTNET_RPC_URL" --etherscan-api-key "$ETHERSCAN_API_KEY" || VERIFICATION_FAILED=true
            fi
            
            # Verify VotingStreakMultiplier
            VOTINGSTREAKMULTIPLIER_ADDR=$(jq -r '.contracts.VotingStreakMultiplier // empty' deployment.json)
            if [ -n "$VOTINGSTREAKMULTIPLIER_ADDR" ] && [ "$VOTINGSTREAKMULTIPLIER_ADDR" != "null" ]; then
              echo "Verifying VotingStreakMultiplier at $VOTINGSTREAKMULTIPLIER_ADDR..."
              forge verify-contract "$VOTINGSTREAKMULTIPLIER_ADDR" src/VotingStreakMultiplier.sol:VotingStreakMultiplier --rpc-url "$TESTNET_RPC_URL" --etherscan-api-key "$ETHERSCAN_API_KEY" || VERIFICATION_FAILED=true
            fi
            
            # Update deployment.json with verification status
            if [ "$VERIFICATION_FAILED" = "true" ]; then
              jq '.verification_status = "partial_failure"' deployment.json > temp.json && mv temp.json deployment.json
              echo "⚠️ Some contract verifications failed. Check logs above for details."
            else
              jq '.verification_status = "success"' deployment.json > temp.json && mv temp.json deployment.json
              echo "✅ All contracts verified successfully!"
            fi
          fi

      - name: Upload deployment artifacts
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            deployment.json
            *_deploy.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Display deployment summary
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -f deployment.json ]; then
            echo "📋 Deployment Summary"
            echo "===================="
            cat deployment.json | jq '.'
            echo ""
            echo "🔗 Contract Addresses:"
            jq -r '.contracts | to_entries[] | "- \(.key): \(.value)"' deployment.json
          else
            echo "ℹ️ No deployment was performed (missing required secrets or fork PR)"
          fi